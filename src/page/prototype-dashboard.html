<!doctype html>
<!--
  PROTOTYPE, throwaway. Answers the "Dashboard layout" ticket: how should the page look and read
  for a trainer seeing it for the first time? Three structurally different variants on one page,
  switch with ?variant=A|B|C, the bottom bar, or the arrow keys. All numbers are simulated.
  Chart.js comes from a CDN here only; the real page bundles it. Do not build on this file.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · Running dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.js"></script>
<style>
:root{--ink:#1c2024;--mute:#667;--line:#e2e4e8;--paper:#fff;--tint:#f5f6f8;--run:#2563a8;--warm:#c8551b;--ok:#2f7d5b}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif;padding-bottom:70px}
h1,h2,h3{margin:0;line-height:1.2}
small,.mute{color:var(--mute)}
.num{font-variant-numeric:tabular-nums}
.chartbox{position:relative;height:190px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;vertical-align:middle}
.seg button{all:unset;cursor:pointer;padding:3px 10px;font-size:13px;color:var(--mute)}
.seg button:focus-visible{outline:2px solid var(--run);outline-offset:-2px}
.seg button.on{background:var(--ink);color:#fff}
.tag{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--tint);color:var(--mute);white-space:nowrap}
.tag.race{background:#fbe6da;color:var(--warm)}.tag.record{background:#dfeaf6;color:var(--run)}.tag.first{background:#e0f0e8;color:var(--ok)}
.ach{display:grid;grid-template-columns:82px 1fr;gap:2px 10px;padding:7px 0;border-bottom:1px solid var(--line)}
.ach time{color:var(--mute);font-size:13px}

/* Variant A: report */
.A{max-width:760px;margin:0 auto;padding:40px 20px}
.A header{border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:32px}
.A h1{font:600 30px/1.2 Georgia,serif}
.A h2{font:600 22px/1.2 Georgia,serif;margin-bottom:6px}
.A section{margin-bottom:48px}
.A .lead{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:18px 0}
.A .lead b{display:block;font-size:34px;line-height:1.1;font-weight:600}
.A .rest{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.A .rest div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)}
.A figure{margin:24px 0}.A figcaption{margin-bottom:6px}
.A summary{cursor:pointer;font-weight:600;padding:8px 0}

/* Variant B: cockpit */
.B{display:grid;grid-template-columns:230px minmax(0,1fr) 310px;height:calc(100vh - 56px)}
.B aside{overflow:auto;padding:16px}
.B .left{background:#14181d;color:#e8eaee}.B .left small{color:#9aa3ad}
.B .left .seg{border-color:#3a424c}.B .left .seg button{padding:3px 7px;font-size:12px;color:#9aa3ad}.B .left .seg button.on{background:#e8eaee;color:#14181d}
.B .left dl{margin:14px 0 0}.B .left dt{font-size:12px;color:#9aa3ad;margin-top:10px}.B .left dd{margin:0;font-size:22px;font-weight:600}
.B main{overflow:auto;padding:14px 16px;background:var(--tint)}
.B .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.B .card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.B .card h3{font-size:13px;margin-bottom:4px}.B .chartbox{height:150px}
.B .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.B .right{border-left:1px solid var(--line)}
.B .ach{grid-template-columns:1fr}

/* Variant C: timeline */
.C{padding:18px 24px;max-width:1280px;margin:0 auto}
.C .band{display:flex;flex-wrap:wrap;gap:6px 26px;align-items:baseline;padding:12px 0;border-block:1px solid var(--line);margin:12px 0 16px}
.C .band b{font-size:19px;font-weight:600}.C .band span{white-space:nowrap}
.C .row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:4px 0}
.C .row h3{font-size:13px}.C .row small{display:block;font-size:12px;line-height:1.3;font-weight:400}
.C .chartbox{height:118px}.C .row.tall .chartbox{height:150px}
.C .pins{position:relative;height:34px;margin-left:52px}
.C .pin{all:unset;position:absolute;width:9px;height:9px;border-radius:50%;transform:translateX(-50%);cursor:pointer;background:var(--mute)}
.C .pin:focus-visible{outline:2px solid var(--ink)}
.C .pin.race{background:var(--warm);top:2px}.C .pin.record{background:var(--run);top:13px}.C .pin.first{background:var(--ok);top:24px}.C .pin.streak{background:#777;top:24px}
.C .detail{min-height:26px;font-size:14px;padding:3px 0 3px 160px}
.C .columns{columns:3;column-gap:28px;margin-top:10px}.C .columns .ach{break-inside:avoid}

/* Round 2 shared */
body[data-v=D],body[data-v=E],body[data-v=F],body[data-v=G]{font-family:ui-rounded,system-ui,sans-serif}
.D h1,.E h1,.night h1{font-size:30px;font-weight:800}
.now{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:22px 0 10px}
.now h2{font-size:21px;font-weight:800}
.story{font-size:21px;font-weight:800;margin:34px 0 0}
.big b{display:block;line-height:1.05}.big span{font-weight:600}
.lvl{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.lvl>div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}

/* Variant D: tiles */
body[data-v=D]{background:#fff8ec}
.D .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.D .big{padding:16px 18px;border-radius:18px}.D .big b{font-size:clamp(32px,4.4vw,50px);font-weight:800}
.t1{background:#ff8a6b}.t2{background:#ffcb57}.t3{background:#7cc4ff}.t4{background:#7fdcb3}
.D .lvl>div{border-color:#eadfc8}

/* Variant E: race bib */
body[data-v=E]{background:#eef6f0}
.bibrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center}
.bibrow .lvl{grid-template-columns:1fr}
.bib{position:relative;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:0 26px 16px;transform:rotate(-1.2deg);box-shadow:4px 5px 0 #1f9d7833;overflow:hidden}
.bib>i{position:absolute;width:12px;height:12px;border-radius:50%;background:#eef6f0;border:2px solid var(--ink);z-index:1}
.bib>i:nth-child(1){top:44px;left:7px}.bib>i:nth-child(2){top:44px;right:7px}.bib>i:nth-child(3){bottom:7px;left:7px}.bib>i:nth-child(4){bottom:7px;right:7px}
.bibtop{margin:0 -26px 10px;background:#e8583a;color:#1c2024;font-weight:800;text-transform:uppercase;letter-spacing:.14em;font-size:13px;text-align:center;padding:6px}
.bibmain{display:flex;align-items:baseline;justify-content:center;gap:10px}
.bibmain b{font-size:clamp(48px,8vw,84px);font-weight:900;line-height:1}.bibmain span{font-weight:700;color:var(--mute)}
.bibmain.sub b{font-size:clamp(30px,4.5vw,46px)}
.bibfoot{display:flex;justify-content:center;gap:22px;margin-top:8px}

/* Variant F: night run */
.night{background:#1b1464;color:#fff;padding:26px 0 22px}
.night .inner{max-width:1280px;margin:0 auto;padding:0 24px}
.night small{color:#b9b4e6}
.night .seg{border-color:#5b53a8}.night .seg button{color:#c9c5ee}.night .seg button.on{background:#d4ff5a;color:#1b1464}
.huge{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:6px 0 16px}
.huge b{font-size:clamp(38px,6.6vw,76px);font-weight:900;font-style:italic;color:#d4ff5a}
.huge .big:nth-child(even) b{color:#ff8ac4}
.night .lvl>div{border-color:#3d3590}.night .lvl span{color:#d9d6f3}

/* Variant G: night run 2 */
.huge5{grid-template-columns:repeat(5,1fr)}
.huge5 b{font-size:clamp(36px,5.2vw,68px)}
.huge5 span,.huge5 small{display:block}.huge5 small{font-size:13px}
.groups{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px 24px;margin-top:10px}
.groups h3{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;min-height:28px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#d4ff5a}
.groups .seg button{padding:1px 7px;font-size:11px;letter-spacing:0;text-transform:none}
.groups .lvl{grid-template-columns:minmax(0,1fr)}.groups .lvl>div{padding:5px 0}
.race{padding:5px 0}.race b{display:block;font-weight:700}
.zonebar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin-top:12px}.zonebar+small{display:block;margin-top:3px;font-size:12px}
.G{--run:#5b3fd6;--warm:#e0257f}
.G .chartbox{height:230px}.G .row.tall .chartbox{height:310px}

a{color:inherit;text-underline-offset:2px}.ext::after{content:" ↗";font-size:.8em}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.filters select,.filters input{font:inherit;font-size:13px;padding:3px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
.acts{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px}
.acts th{text-align:left;font-size:12px;color:var(--mute);border-bottom:2px solid var(--line);padding:5px 8px 5px 0}
.acts th button{all:unset;cursor:pointer}.acts th button:hover{color:var(--ink)}.acts th button:focus-visible{outline:2px solid var(--run);outline-offset:2px}
.acts td{padding:6px 8px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.acts td:first-child{white-space:nowrap}.acts .tag{margin-left:3px}
.more{all:unset;cursor:pointer;margin-top:10px;padding:4px 12px;border:1px solid var(--line);border-radius:7px;font-size:13px}
.more:focus-visible{outline:2px solid var(--run)}

/* Prototype switcher, not part of any design */
#switcher{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:#111;color:#fff;border-radius:99px;padding:6px 10px;font-size:13px;box-shadow:0 4px 18px #0006;z-index:9;white-space:nowrap}
#switcher button{all:unset;cursor:pointer;padding:2px 9px}
#switcher small{color:#f5c04a}

@media (max-width:1000px){
  .B{display:block;height:auto}.B aside,.B main{overflow:visible}
  .B .grid{grid-template-columns:minmax(0,1fr)}
  .C .columns{columns:1}.C{padding:14px 16px}
  .C .row{grid-template-columns:minmax(0,1fr)}.C .detail{padding-left:0}
}
@media (max-width:1000px){.groups{grid-template-columns:repeat(2,minmax(0,1fr))}.huge5{grid-template-columns:repeat(3,1fr)}}
@media (max-width:560px){
  .acts th:nth-child(n+3):not(:nth-child(4)),.acts td:nth-child(n+3):not(:nth-child(4)){display:none}
  .groups{grid-template-columns:minmax(0,1fr)}.huge.huge5{grid-template-columns:1fr 1fr}.huge5 .big:last-child{grid-column:span 2}
  .A .lead{grid-template-columns:1fr 1fr}.A .rest{grid-template-columns:1fr}
  .D .tiles,.huge{grid-template-columns:1fr 1fr}.lvl,.bibrow{grid-template-columns:minmax(0,1fr)}
  #switcher small{display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="switcher"></div>
<script>
// ---------- Fake data: simulated run by run so the records and their volume behave like real ones ----------
const seeded=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};const rng=seeded(2026),rng2=seeded(7);
const DAY=864e5, iso=d=>new Date(d).toISOString().slice(0,10);
const START=Date.parse('2022-03-07'), END=Date.parse('2026-10-26'), WATCH='2024-08-23';
const LAYOFFS=[['2023-07-03','2023-08-21'],['2025-02-03','2025-03-10']];
const RACES={'2022-11-13':[5,'Fake Harbour 5K'],'2023-04-23':[5,'Fake Spring 5K'],'2023-12-31':[5,'Fake New Year 5K'],'2024-05-19':[10,'Fake Old Town 10K'],'2024-11-10':[10,'Fake Autumn 10K'],'2025-05-18':[10,'Fake Old Town 10K'],'2025-11-09':[10,'Fake Autumn 10K'],'2026-04-19':[12,'Fake Bridges 12K'],'2026-10-11':[10,'Fake Autumn 10K']};
const fitAt=t=>Math.min(1,(t-START)/(END-START)*1.05);
function mkRun(date,km,fit,race){
  const has=d=>km>=d, n=race?0:1;
  const r={date,type:'run',km:+km.toFixed(1),moving:Math.round(km*(400-fit*60+rng()*30)),race:race||null,
    best1:Math.round(325-fit*70+n*rng()*25),best5:has(5)?Math.round(1900-fit*380+n*rng()*120):null,best10:has(10)?Math.round(4000-fit*780+n*rng()*240):null,stopped:race?Math.round(rng()*90):0};
  if(date>=WATCH){const easy=rng()<.4,m=r.moving/60;r.hr=Math.round(166-fit*12+rng()*8-(easy?14:0));
    r.zones=easy?[.1,.75,.15,0,0].map(z=>z*m):[.05,.2,.4,.3,.05].map(z=>z*m);r.z2=easy}
  return r}
const activities=[];
for(let w=START;w<=END;w+=7*DAY){
  if(LAYOFFS.some(([a,b])=>iso(w)>=a&&iso(w)<b))continue;
  const fit=fitAt(w), n=rng()<.12?0:Math.round(.2+fit*1.3+rng()*.8);
  for(let i=0;i<n;i++){const long=i===n-1;
    activities.push(mkRun(iso(w+Math.floor(rng()*7)*DAY),long?5+fit*9+rng()*3:3.5+fit*3+rng()*2.5,fit))}
  if(rng()<.3)activities.push({date:iso(w+2*DAY),type:'strength'});
}
for(const[d,[km,name]]of Object.entries(RACES))activities.push(mkRun(d,km+.1,fitAt(Date.parse(d)),name));
activities.sort((a,b)=>a.date<b.date?-1:1);
// Fake Strava ids are 16 digits, far above real ones, so links land on a not-found page and never on a stranger's activity.
const pick=l=>l[Math.floor(rng2()*l.length)],SESS=[['intervals','6x1km'],['fartlek','30/30'],['hills','8x200m'],['zone 2','easy'],['HIIT','tabata'],['running test','12 min']];
activities.forEach((a,i)=>{
  const prov=a.date>='2026-10-20'; // provisional: known only from Polar, so no Strava id, title, or session type yet
  a.id=prov?null:'99'+String(i).padStart(14,'0');
  if(a.type!=='run'){a.type=pick(['strength','strength','hike','swim']);a.moving=Math.round(1800+rng2()*3600);if(a.type==='hike')a.km=+(5+rng2()*9).toFixed(1);a.title=prov?null:{strength:'Gym session',hike:'Sunday hike',swim:'Pool swim'}[a.type];return}
  if(a.race){a.title=a.race;return}
  if(prov)return;
  const x=rng2(),[session,detail]=a.km>=10&&x<.5?['long run',a.km+' km']:x<.3?pick(SESS):[null];
  a.session=session;a.title=session?`[${session}] ${detail}`:pick(['Morning run','Evening run','Lunch run'])});
const runs=activities.filter(a=>a.type==='run');

// Candidate DashboardData shape: { meta, activities, trends: {month, week}, achievements }
const mondayOf=d=>{const t=Date.parse(d),wd=(new Date(t).getUTCDay()+6)%7;return iso(t-wd*DAY)};
function trend(key,keys){
  const m=new Map(keys.map(k=>[k,{key:k,km:0,longest:null,best5:null,best10:null,race5:false,race10:false,zones:[0,0,0,0,0],hrSum:0,hrN:0,effSum:0,z2:[]}]));
  for(const r of runs){const b=m.get(key(r.date));if(!b)continue;b.km+=r.km;b.longest=Math.max(b.longest||0,r.km);
    for(const[f,fl]of[['best5','race5'],['best10','race10']])if(r[f]&&(!b[f]||r[f]<b[f])){b[f]=r[f];b[fl]=!!r.race}
    if(r.hr){r.zones.forEach((z,i)=>b.zones[i]+=z/60);b.hrSum+=r.hr;b.hrN++;b.effSum+=r.km*1000/(r.moving/60)/r.hr;if(r.z2)b.z2.push(r.moving/r.km)}}
  return[...m.values()]}
const monthKeys=[],weekKeys=[];
for(let y=2022,mo=3;`${y}-${String(mo).padStart(2,'0')}`<=iso(END).slice(0,7);mo==12?(y++,mo=1):mo++)monthKeys.push(`${y}-${String(mo).padStart(2,'0')}`);
for(let w=START;w<=END;w+=7*DAY)weekKeys.push(iso(w));
const trends={month:trend(d=>d.slice(0,7),monthKeys),week:trend(mondayOf,weekKeys)};

const fmt=s=>{if(s==null)return'–';s=Math.round(s);return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
function streaks(mode){ // weeks in a row, oldest first
  const set=new Set((mode==='runs'?runs:activities).map(a=>mondayOf(a.date)));let cur=0,list=[];
  for(const k of weekKeys){if(set.has(k)){cur++;list.at(-1)?.open?list.at(-1).len=cur:list.push({len:1,open:true,end:k});list.at(-1).end=k}else{cur=0;if(list.at(-1))list.at(-1).open=false}}
  return list}
function achievements(mode){
  let act=null;const out=[],add=(date,kind,title,detail='')=>out.push({date,kind,title,detail,act});
  const best={},done=new Set(),barriers={best5:[1800,1650,1500],best10:[3600,3300,3000],best1:[300,270,240]},names={best1:'1K',best5:'5K',best10:'10K'};
  let longest=0,maxKm=10;
  runs.forEach((r,i)=>{act=r;
    if(i===0)add(r.date,'first','First run',`${r.km} km`);
    if(r.race){if(!done.has('race')){done.add('race');add(r.date,'first','First race')}
      add(r.date,'race',r.race,`${r.km} km · ${fmt(r.moving)} · stopped ${fmt(r.stopped)}`)}
    if(r.km>=10&&!done.has('long')){done.add('long');add(r.date,'first','First long run',`${r.km} km`)}
    while(r.km>=maxKm+1&&Math.floor(r.km)>=11){maxKm++;if(maxKm>=11)add(r.date,'first',`First ${maxKm} km`)}
    for(const f of['best1','best5','best10'])if(r[f]){
      if(!best[f]||r[f]<best[f]){if(best[f])add(r.date,'record',`${names[f]} best effort`,`${fmt(r[f])}, was ${fmt(best[f])}`);best[f]=r[f]}
      for(const b of barriers[f])if(r[f]<b&&!done.has(f+b)){done.add(f+b);add(r.date,'first',`${names[f]} under ${fmt(b)}`,fmt(r[f]))}}
    if(r.km>longest){if(longest)add(r.date,'record','Longest run',`${r.km} km, was ${longest} km`);longest=r.km}
  });
  act=null;
  for(const[b,label]of[[trends.week,'week'],[trends.month,'month']]){let top=0;
    for(const x of b)if(x.km>top&&x.km>0){if(top)add(x.key.length===7?x.key+'-28':x.key,'record',`Record ${label}`,`${x.km.toFixed(1)} km, was ${top.toFixed(1)} km`);top=x.km}}
  // shortcut: one row per record-breaking streak, not per week; "each time it's beaten" would add a row every week of a streak
  let top=0;for(const s of streaks(mode))if(s.len>top){top=s.len;add(s.end,'streak',`Longest streak: ${s.len} weeks`,mode==='runs'?'runs only':'any activity')}
  return out.sort((a,b)=>a.date<b.date?1:-1)}

function stats(period,mode){
  const end=Date.parse(activities.at(-1).date),days={'3w':21,'8w':56,'3m':91,'1y':365,all:(end-START)/DAY}[period];
  const from=iso(end-days*DAY),inP=activities.filter(a=>a.date>from),rs=inP.filter(a=>a.type==='run'),wk=days/7;
  const min=f=>{const v=rs.map(r=>r[f]).filter(Boolean);return v.length?Math.min(...v):null};
  const last=streaks(mode).at(-1);
  const total=rs.reduce((s,r)=>s+r.km,0),hrRuns=rs.filter(r=>r.hr),avg=f=>hrRuns.length?hrRuns.reduce((s,r)=>s+f(r),0)/hrRuns.length:null;
  const z2=rs.filter(r=>r.z2),zones=[0,1,2,3,4].map(i=>hrRuns.reduce((s,r)=>s+r.zones[i],0)),zt=zones.reduce((a,b)=>a+b,0)||1;
  const races=runs.filter(r=>r.race),fastest=(l,f)=>l.reduce((a,r)=>!a||f(r)<f(a)?r:a,null);
  const prevKm=runs.filter(r=>r.date>iso(end-2*days*DAY)&&r.date<=from).reduce((s,r)=>s+r.km,0),allBest=f=>Math.min(...runs.map(r=>r[f]).filter(Boolean)),secs=rs.reduce((s,r)=>s+r.moving,0);
  const more={b1:fmt(min('best1')),all1:fmt(allBest('best1')),all5:fmt(allBest('best5')),all10:fmt(allBest('best10')),allLong:Math.max(...runs.map(r=>r.km)),runs:rs.length,
    total:total.toFixed(0),time:`${Math.floor(secs/3600)} h ${String(Math.floor(secs%3600/60)).padStart(2,'0')}`,delta:period!=='all'&&prevKm?Math.round((total-prevKm)/prevKm*100):null,

  document.title=`PROTOTYPE ${S.variant} · ${V[S.variant][0]}`;
  document.getElementById('switcher').innerHTML=`<button data-go="-1" aria-label="Previous variant">←</button><b>${S.variant} (${V[S.variant][0]})</b><button data-go="1" aria-label="Next variant">→</button><small>fake data · ${S.period} · ${S.bucket} · ${S.streak}</small>`}
function go(d){S.variant=KEYS[(KEYS.indexOf(S.variant)+d+KEYS.length)%KEYS.length];S.pin=null;try{history.replaceState(null,'','?variant='+S.variant)}catch{}render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-set],[data-go]');if(!b)return;
  if(b.dataset.go)return go(+b.dataset.go);
  const[k,v]=b.dataset.set.split(':');S[k]=k==='pin'||k==='limit'?+v:v;if(k==='filter')S.pin=null;if(k==='type'||k==='mark')S.limit=40;render()});
document.addEventListener('click',e=>{const k=e.target.closest('[data-sort]')?.dataset.sort;if(!k)return;
  S.dir=S.sort===k?(S.dir==='asc'?'desc':'asc'):COLS.find(c=>c.key===k).asc?'asc':'desc';S.sort=k;S.limit=40; // first click: fastest pace, A to Z, otherwise highest or newest
  document.getElementById('acttable').innerHTML=actTable();document.querySelector(`[data-sort=${k}]`).focus()});
document.addEventListener('change',e=>{const k=e.target.dataset.filter;if(k){S[k]=e.target.value;S.limit=40;render()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;S.limit=40;document.getElementById('acttable').innerHTML=actTable()}});
document.addEventListener('keydown',e=>{if(e.target.matches('input,select,textarea'))return;if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}if(e.key==='ArrowRight'){e.preventDefault();go(1)}});
render();
</script>
</body>
</html>
