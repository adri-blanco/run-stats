<style>:root{--ink:#1c2024;--mute:#667;--line:#e2e4e8;--paper:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 ui-rounded,system-ui,sans-serif}
h1,h2{margin:0;line-height:1.2;letter-spacing:-.01em}
a{color:inherit;text-underline-offset:2px;text-decoration-color:color-mix(in srgb,currentColor 35%,transparent)}
a:hover{text-decoration-color:currentColor}
small{color:var(--mute)}
.num{font-variant-numeric:tabular-nums}
.night{background:#1b1464;color:#fff;padding:26px 0 22px}
.night .inner{max-width:1280px;margin:0 auto;padding:0 24px}
.night h1{margin-bottom:8px}
.night h1 img{display:block;height:44px;max-width:100%}
.night small{color:#b9b4e6}
.content{max-width:1280px;margin:0 auto;padding:18px 24px}
.story{font-size:21px;font-weight:800;margin:40px 0 0}
.content>.story:first-child{margin-top:16px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.filters select,.filters input{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
.scroll{overflow-x:auto}
.acts{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px}
.acts th{text-align:left;font-size:12px;color:var(--mute);border-bottom:2px solid var(--line);padding:5px 8px 5px 0}
.acts th button{all:unset;cursor:pointer}
.acts th button:hover{color:var(--ink)}
.acts th button:focus-visible{outline:2px solid #2563a8;outline-offset:2px}
.acts th[aria-sort=ascending] button::after{content:" ▲"}
.acts th[aria-sort=descending] button::after{content:" ▼"}
.acts td{padding:6px 8px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.acts td.num{white-space:nowrap}
.acts tr>:nth-child(n+4){text-align:right}
.acts tr>:last-child{padding-right:0}
.tag{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;background:#f5f6f8;color:var(--mute);white-space:nowrap;margin-left:3px}
.tag.race{background:#fbe6da;color:#b01560}
.tag.session{background:#ebe7fb;color:#5b3fd6}
.seg{display:inline-flex;border:1px solid #5b53a8;border-radius:7px;overflow:hidden;vertical-align:middle}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:13px;color:#c9c5ee}
.seg button:hover:not(.on){color:#fff}
.seg button:focus-visible{outline:2px solid #d4ff5a;outline-offset:-2px}
.seg button.on{background:#d4ff5a;color:#1b1464}
.content .seg{border-color:var(--line)}
.content .seg button{color:var(--mute)}
.content .seg button:hover:not(.on){color:var(--ink)}
.content .seg button:focus-visible{outline-color:#2563a8}
.content .seg button.on{background:var(--ink);color:#fff}
.row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:4px 0}
.row h3{margin:0;font-size:13px}
.row small{display:block;font-size:12px;line-height:1.3;font-weight:400}
.chartbox{position:relative;height:230px}
.row.tall .chartbox{height:310px}
@media (max-width:700px){.row{grid-template-columns:minmax(0,1fr)}}
.now{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:22px 0 10px}
.now h2{font-size:21px;font-weight:800}
.huge{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:6px 0 16px}
.big b{display:block;line-height:1.05;letter-spacing:-.02em;font-size:clamp(36px,5.2vw,68px);font-weight:900;font-style:italic;color:#d4ff5a}
.big span,.big small{display:block}
.big span{font-weight:600}
.big small{font-size:13px}
.groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 40px;margin-top:10px}
.groups h3,.recent{display:flex;align-items:center;min-height:28px;margin:0;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#d4ff5a}
.groups .race{padding:5px 0}
.groups .race b,.groups .race small{display:block}
.groups .race b{font-weight:700}
.lvl>div{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid #3d3590}
.lvl span{color:#d9d6f3}
.recent{margin-top:18px}
.awaiting{display:block;margin-top:12px}
.night .acts th{color:#b9b4e6;border-color:#3d3590}
.night .acts td{border-color:#3d3590}
@media (max-width:1000px){.huge{grid-template-columns:repeat(3,1fr)}}
@media (max-width:560px){.huge{grid-template-columns:1fr 1fr}.big:last-child{grid-column:span 2}}
.contents{display:contents}
.lvl+.seg{margin-top:10px}
.groups .seg button{padding:4px 10px;font-size:12px}
.lvl b{white-space:nowrap}
.more{all:unset;display:inline-block;cursor:pointer;margin-top:10px;padding:4px 12px;border:1px solid var(--line);border-radius:7px;font-size:13px}
.more[hidden]{display:none}
.more:focus-visible{outline:2px solid #2563a8}
.more:hover{border-color:var(--mute)}
.dots{position:relative;height:62px}
.dot{all:unset;position:absolute;width:9px;height:9px;border-radius:50%;transform:translateX(-50%);cursor:pointer}
.dot::after{content:"";position:absolute;inset:-3px -4px}
.dot:focus-visible,.dot:hover,.dot[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:1px}
.dot.race{background:#e0257f;top:2px}
.dot.record{background:#5b3fd6;top:18px}
.dot.first{background:#2f7d5b;top:34px}
.dot.streak{background:var(--mute);top:50px}
.key.race{color:#e0257f}
.key.record{color:#5b3fd6}
.key.first{color:#2f7d5b}
.key.streak{color:var(--mute)}
.detail{min-height:26px;font-size:14px;padding:3px 0 3px 224px}
.tag.record{background:#ebe7fb;color:#5b3fd6}
.tag.first{background:#e0f0e8;color:#256b4d}
summary.story{cursor:pointer;font-size:17px;font-weight:700;margin-top:20px}
.columns{columns:3;column-gap:28px;margin-top:10px}
.ach{display:grid;grid-template-columns:82px minmax(0,1fr);gap:2px 10px;padding:7px 0;border-bottom:1px solid var(--line);break-inside:avoid;font-size:14px}
.ach>span{color:var(--mute);font-size:13px}
.ach>div{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;column-gap:8px}
.ach b{font-weight:600}
.ach small{display:block;grid-column:1/-1}
@media (max-width:700px){.detail{padding-left:0}.columns{columns:1}}
.seg button,.more{transition:transform 100ms ease-out}
.seg button:active,.more:active{transform:scale(.97);transition:none}
@media (prefers-reduced-motion:reduce){.seg button,.more{transition:none}.seg button:active,.more:active{transform:none}}
@media (pointer:coarse){.seg button{padding:10px 14px}.groups .seg button{padding:8px 12px}.filters select,.filters input{padding:10px 12px}}
@media (max-width:560px){
  .groups{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
  .night .inner,.content{padding-inline:16px}
  .filters select,.filters input{font-size:16px}
  /* Type is a filter here and mostly implied by the title; the bleed shows the rest scrolls. */
  .acts tr>:nth-child(3){display:none}
  .scroll{margin-right:-16px}
  .acts tr>:last-child{padding-right:16px}
}
@page{margin:12mm}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .seg,.filters,.detail,.all{display:none}
  .night{padding:16px 0}
  .night .inner{padding:0 12px}
  .content{padding:16px 0 0}
  .chartbox canvas{width:100%!important;height:100%!important}
  .scroll{overflow:visible}
  .row,tr{break-inside:avoid}
  .story,.recent{break-after:avoid}
  summary.story{list-style:none}
}
</style>
</head>
